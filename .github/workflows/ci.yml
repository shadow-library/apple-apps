name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  XCODE_VERSION: "27.2"

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v5
      - run: mise run lint
      - name: Check generated design tokens
        env:
          GENERATED_TOKENS: Packages/ShadowKit/Sources/ShadowDesignSystem/Tokens/Generated
        run: |
          mise run tokens
          git add --intent-to-add "$GENERATED_TOKENS"
          git diff --exit-code -- "$GENERATED_TOKENS"

  packages:
    name: Shared packages
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v5
      - run: mise run test:packages

  apps:
    name: Apps (${{ matrix.platform }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            testFlags: ""
          - platform: macOS
            testFlags: --skip-ui-tests
          - platform: visionOS
            testFlags: --skip-ui-tests
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v5
      - run: tuist install
      - run: mise run lint:graph
      - run: tuist test --platform ${{ matrix.platform }} ${{ matrix.testFlags }}
